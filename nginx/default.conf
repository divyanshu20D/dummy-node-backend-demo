# Define the HTTP server.
server {
    # Listen for HTTP traffic on port 80.
    listen 80;

    # Accept requests for any domain or IP.
    server_name _;

    # Limit request body size to 10 MB.
    client_max_body_size 10m;

    # Forward all routes to the Node.js app.
    location / {
        # Send traffic to the app container on port 3000.
        proxy_pass http://app:3000;

        # Use HTTP/1.1 for proxying.
        proxy_http_version 1.1;

        # Forward the original host header.
        proxy_set_header Host $host;

        # Forward the real client IP.
        proxy_set_header X-Real-IP $remote_addr;

        # Forward the full client IP chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward the original request protocol.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support protocol upgrades such as WebSockets.
        proxy_set_header Upgrade $http_upgrade;

        # Keep upgrade connections working.
        proxy_set_header Connection "upgrade";
    }
}
